# Netlify-asetukset: staattinen sivu, ei build-vaihetta.
[build]
  publish = "."

# Siistit osoitteet: /tue näyttää tue.html:n jne.
[[headers]]
  for = "/kuvat/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Myyjien sisäinen lomake: ei hakukoneisiin
[[headers]]
  for = "/myyjat*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
